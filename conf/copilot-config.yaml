# GitHub Copilot Models Available
# Usage: Copy the desired models to your copilot-config.yaml


litellm_settings:
  drop_params: true
  max_request_size_mb: 10
  max_response_size_mb: 20
  disable_end_user_cost_tracking: true
  callbacks:
    - websearch_interception
  websearch_interception_params:
    enabled_providers:
      - github_copilot
    search_tool_name: tavily-search

search_tools:
  - search_tool_name: tavily-search
    litellm_params:
      search_provider: tavily
      api_key: os.environ/TAVILY_API_KEY
  - search_tool_name: searxng-search
    litellm_params:
      search_provider: searxng
      api_base: os.environ/SEARXNG_API_BASE

general_settings:
  database_url: postgresql://litellm:litellm@postgres:5432/litellm

model_list:

  - model_name: claude-opus-4.7-1m-internal
    litellm_params:
      model: github_copilot/claude-opus-4.7-1m-internal
      extra_headers: {"Editor-Version": "vscode/1.121.0", "Copilot-Integration-Id": "vscode-chat"}
    # Claude Opus 4.7 (1M context)(Internal only) (Anthropic) - enabled
    # Max tokens: 64000, Context: 1000000

  - model_name: claude-opus-4.7-high
